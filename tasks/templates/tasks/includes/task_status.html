<li class="list-group-item d-flex justify-content-between align-items-center">
<div>
<strong>{{ task.title|default:"Без названия" }}</strong>
<br>
<small class="text-muted">Тема: {{ task.topic.name }} | Группа: {{ task.group.name }}</small>
</div>
<div>
{% if task.done %}
<span class="badge bg-success">готово</span>
{% else %}
<span class="badge bg-secondary">в работе</span>
{% endif %}
<a href="{% url 'tasks:detail' task.id %}" class="btn btn-sm btn-outline-primary ms-2">
Подробнее
</a>
</div>
</li>
